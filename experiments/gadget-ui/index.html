<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEMO = true; // נתונים מדומים. בחיבור אמיתי: false
  const state = { treats: 12, audioOn: false, barks: 0, fed: 0, pulls: 0, cooling: false, burst: 0, spike: 0, level: 0 };

     Kora.onListen(on)  — להפעיל/להשתיק את השמע של ה-WebRTC
     Kora.onGate(0..1)  — לכוון שער רעש ב-Web Audio
     להזנת מד אמיתי: DEMO=false; state.level = ...; ובנביחה אמיתית: bark(false) */
  window.Kora = { onListen: null, onGate: null };
  $('gate').addEventListener('input', () => { window.Kora && Kora.onGate && Kora.onGate($('gate').value / 100); });

  renderCounter(); renderTicker();
  requestAnimationFrame(levelTick); requestAnimationFrame(dogTick); requestAnimationFrame(camTick); requestAnimationFrame(tiltTick);
})();
</script>
</body>
</html>
